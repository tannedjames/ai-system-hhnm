<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG User Assistant</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --primary: #0b5fff;
      --line: #dbe2ee;
      --ok: #0f766e;
      --danger: #b91c1c;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(150deg, #f4f7fb, #e8f0ff);
      color: var(--ink);
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .grid {
      display: grid;
      gap: 10px;
    }
    input, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 10px;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: 0;
      cursor: pointer;
    }
    button.secondary {
      background: #1e293b;
    }
    #status {
      color: var(--muted);
      min-height: 20px;
    }
    #answer {
      white-space: pre-wrap;
      line-height: 1.45;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 70px;
      background: #fbfdff;
    }
    #sources li {
      margin-bottom: 8px;
      color: var(--muted);
    }
    .ok { color: var(--ok); }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Internal RAG Assistant</h1>
      <div class="grid">
        <input id="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <div class="actions">
          <button id="loginBtn">Login</button>
        </div>
        <div id="status">Not authenticated</div>
      </div>
    </section>

    <section class="card">
      <h2>Ask Knowledge Base</h2>
      <div class="grid">
        <textarea id="question" placeholder="Ask about policy, process, handbook, course materials..."></textarea>
        <div class="actions">
          <button id="askBtn">Ask</button>
          <button id="askStreamBtn" class="secondary">Ask (Streaming)</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Answer</h2>
      <div id="answer"></div>
    </section>

    <section class="card">
      <h2>Citations</h2>
      <ol id="sources"></ol>
    </section>
  </main>

  <script>
    let token = "";

    function setStatus(text, cls = "") {
      const el = document.getElementById("status");
      el.className = cls;
      el.textContent = text;
    }

    function renderSources(citations) {
      const container = document.getElementById("sources");
      container.innerHTML = "";
      citations.forEach((c) => {
        const li = document.createElement("li");
        li.textContent = `[${c.id}] ${c.source || "unknown"} | page ${c.page || "?"} | score ${Number(c.score || 0).toFixed(4)} | ${c.snippet || ""}`;
        container.appendChild(li);
      });
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const body = new URLSearchParams();
      body.set("username", email);
      body.set("password", password);

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
      });

      if (!res.ok) {
        setStatus("Login failed", "danger");
        return;
      }

      const data = await res.json();
      token = data.access_token;
      setStatus("Authenticated", "ok");
    }

    async function ask() {
      const question = document.getElementById("question").value.trim();
      if (!question) return;
      if (!token) {
        setStatus("Please login first", "danger");
        return;
      }

      setStatus("Querying...", "");
      document.getElementById("answer").textContent = "";
      renderSources([]);

      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ question })
      });

      if (!res.ok) {
        setStatus("Query failed", "danger");
        return;
      }

      const data = await res.json();
      document.getElementById("answer").textContent = data.answer || "";
      renderSources(data.citations || []);
      setStatus("Done", "ok");
    }

    function parseSseBlock(block) {
      const lines = block.split("\n");
      let event = "message";
      let data = "";
      for (const line of lines) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      return { event, data };
    }

    async function askStreaming() {
      const question = document.getElementById("question").value.trim();
      if (!question) return;
      if (!token) {
        setStatus("Please login first", "danger");
        return;
      }

      setStatus("Streaming...", "");
      document.getElementById("answer").textContent = "";
      renderSources([]);

      const res = await fetch("/api/ask/stream", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ question })
      });

      if (!res.ok || !res.body) {
        setStatus("Streaming failed", "danger");
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx = buffer.indexOf("\n\n");
        while (idx >= 0) {
          const block = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const { event, data } = parseSseBlock(block);

          if (event === "token" && data) {
            try {
              const payload = JSON.parse(data);
              document.getElementById("answer").textContent += payload.text || "";
            } catch (_) {}
          } else if (event === "citations" && data) {
            try {
              renderSources(JSON.parse(data));
            } catch (_) {}
          } else if (event === "error") {
            setStatus("Stream error: " + data, "danger");
          } else if (event === "done") {
            setStatus("Done", "ok");
          }

          idx = buffer.indexOf("\n\n");
        }
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("askBtn").addEventListener("click", ask);
    document.getElementById("askStreamBtn").addEventListener("click", askStreaming);
  </script>
</body>
</html>
