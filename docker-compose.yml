services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend-user
      - frontend-admin
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - minio
      - qdrant
      - redis
  frontend-user:
    build:
      context: ./frontend-user
    depends_on:
      - api

  frontend-admin:
    build:
      context: ./frontend-admin
    depends_on:
      - api

  worker:
    build: .
    command: celery -A celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - postgres
      - minio
      - qdrant
      - redis
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rag-system/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  postgres_data:
  minio_data:
  redis_data:
